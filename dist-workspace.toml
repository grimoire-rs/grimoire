[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax).
# Windows, macOS, and Linux (gnu + musl) — each for both aarch64 and x86_64.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl", "aarch64-pc-windows-msvc", "x86_64-pc-windows-msvc"]
# Where to host releases
hosting = "github"
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# The archive format to use for windows builds (defaults .zip)
windows-archive = ".zip"
# Which actions to run on pull requests
pr-run-mode = "skip"
# Post-announce jobs: sign and publish the OCX package (`release-ocx.yml`), then
# republish the first-party catalog with the freshly released grim (idempotent
# when catalog versions are unchanged).
post-announce-jobs = ["./release-ocx", "./publish-catalog"]
# Both custom jobs push to GHCR — the called workflows declare
# `packages: write`, which the caller must grant (a reusable workflow can only
# downscope the caller's permissions). `release-ocx` also signs and attests
# keyless, which needs the OIDC token: `id-token: write`.
github-custom-job-permissions = { "release-ocx" = { contents = "read", packages = "write", id-token = "write" }, "publish-catalog" = { contents = "read", packages = "write" } }
# Release by manual dispatch from main, not by tag push: a tag-push run would put
# `@refs/tags/vX.Y.Z` in every signing certificate, a different identity each release.
# `release.yml` stays pure generator output; the signing job is the called workflow
# `release-ocx.yml`, whose certificate identity is that file at `refs/heads/main`.
dispatch-releases = true
# Generate and dist a source tarball
source-tarball = false
# Whether to embed dependency information using cargo-auditable
cargo-auditable = true
# Whether to use cargo-cyclonedx to generate an SBOM
cargo-cyclonedx = true
# Publish GitHub build provenance attestations for the release archives
github-attestations = true

# GitHub retired the `macos-14` image dist 0.33.0 picks for Apple Silicon; the
# job is cancelled before it starts and the release never reaches `host`.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
