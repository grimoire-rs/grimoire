[book]
title = "Grimoire"
authors = ["The Grimoire Authors"]
description = "Package manager for AI-agent config — skills, rules, agents, and MCP servers, installed into every coding agent you use"
language = "en"
src = "src"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/grimoire-rs/grimoire"
edit-url-template = "https://github.com/grimoire-rs/grimoire/edit/main/docs/{path}"
additional-css = ["theme/clients-matrix.css"]

[output.html.fold]
enable = true
level = 1
