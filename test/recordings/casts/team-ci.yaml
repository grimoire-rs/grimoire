#
# The team-ci.md cast (scenario S-010): a declaration edited without
# relocking. `grim install` refuses with exit 65; `grim status --check` sees
# the same divergence, reports `stale`, and still exits 0 -- which is the
# whole point of the page. `grim lock` clears it.
#
# The edit is both halves the page names: an existing entry's rung is moved,
# AND a second artifact is declared that nobody locked. `lint-rules` is that
# second artifact, and it exists so the page can print its digest, its
# `locked` row and its `installed` row from a run rather than from nothing.
# The supported YAML subset is documented in ../test_record_casts.py.
output: docs/public/casts/team-ci.cast
title: "grim: the lock is the CI gate"
registry: local
columns: 180
rows: 24
dirs:
  - .claude
  - code-review
  - lint-rules
steps:
  - type: printf '%s\n' '---' 'name: code-review' 'description: Review a diff for correctness and style.' '---' 'Read the diff, then report findings.' | tee code-review/SKILL.md
    expect: description: Review a diff for correctness and style\.
  - type: printf '%s\n' '---' 'name: lint-rules' 'description: Apply the house lint rules.' '---' 'Run the linter, then explain each finding.' | tee lint-rules/SKILL.md
    expect: description: Apply the house lint rules\.
  - type: grim release code-review {registry}/acme/skills/code-review:1.0.0
    expect: /acme/skills/code-review:1\.0\.0\s+sha256:[0-9a-f]{64}\s+1\.0\.0,1\.0,1,latest\s+true
  - type: grim release lint-rules {registry}/acme/skills/lint-rules:1.0.0
    expect: /acme/skills/lint-rules:1\.0\.0\s+sha256:[0-9a-f]{64}\s+1\.0\.0,1\.0,1,latest\s+true
  - type: grim init
    expect: grimoire\.toml\s+project\s+created
  # Only code-review is added, so only code-review reaches the lock.
  - type: grim add {registry}/acme/skills/code-review:1
    expect: skill\s+code-review\s+\S+@sha256:[0-9a-f]{64}\s+added
  # The page prints this file. Recorded so the `declaration_hash` it quotes,
  # and the one the stale refusal below names, are the same measured pair.
  - type: cat grimoire.lock
    expect: pinned = "\S+/acme/skills/code-review@sha256:[0-9a-f]{64}"
  # The declaration moves from the `1` ladder tag to `1.0.0` and gains a
  # second entry; the lock is regenerated by neither. `tail` puts the edited
  # block into the recording.
  - type: sed -i -e 's|code-review:1"|code-review:1.0.0"|' -e '/^\[skills\]/a lint-rules = "{registry}/acme/skills/lint-rules:1"' grimoire.toml && tail -5 grimoire.toml
    expect: lint-rules = "\S+/acme/skills/lint-rules:1"[\s\S]*code-review = "\S+/acme/skills/code-review:1\.0\.0"
  # The blank line printf emits keeps the exit-status line out of the
  # preceding table's column-alignment scan (assert_tables_column_aligned).
  - type: grim install; printf '\nexit status %s\n' "$?"
    expect: grimoire\.lock is stale[\s\S]*run `grim lock` before installing[\s\S]*exit status 65
  # The page's point: `status --check` reports the same divergence as `stale`
  # and still exits 0. It reports; `install` is the gate.
  - type: grim status --check; printf '\nexit status %s\n' "$?"
    expect: skill\s+code-review\s+direct\s+\S+@sha256:[0-9a-f]{64}\s+stale[\s\S]*skill\s+lint-rules\s+direct\s+\S+\s+stale[\s\S]*exit status 0
  - type: grim lock
    expect: skill\s+code-review\s+\S+@sha256:[0-9a-f]{64}\s+\w+[\s\S]*skill\s+lint-rules\s+\S+@sha256:[0-9a-f]{64}\s+\w+
  - type: grim install; printf '\nexit status %s\n' "$?"
    expect: skill\s+code-review\s+\S+\s+(unchanged|installed)[\s\S]*skill\s+lint-rules\s+\S+\s+installed[\s\S]*exit status 0
