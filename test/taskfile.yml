# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  BIN_DIR: "{{.ROOT_DIR}}/test/bin"
  GRIM_BINARY: "{{.BIN_DIR}}/grim{{exeExt}}"
  SKIP_BUILD: '{{.SKIP_BUILD | default .CI | default "false"}}'

tasks:
  build:
    internal: true
    cmds:
      - cargo build --release --locked
      - mkdir -p {{.BIN_DIR}}
      - cp {{.ROOT_DIR}}/target/release/grim{{exeExt}} {{.GRIM_BINARY}}
    status:
      - '{{eq .SKIP_BUILD "true"}}'

  default:
    desc: Run acceptance tests (builds the grim binary automatically)
    cmds:
      - task: build
        vars:
          SKIP_BUILD: "{{.SKIP_BUILD}}"
      # ocx exec puts zot and uv (both pinned in the root ocx.toml) on PATH.
      # index_e2e and bench need inputs the ordinary run lacks; they have their
      # own tasks and deep-verify jobs.
      - ocx exec -- uv run pytest -m "not index_e2e and not bench" {{.CLI_ARGS | default "-v"}}
    env:
      GRIM_COMMAND: "{{.GRIM_BINARY}}"

  .index-e2e-indexer:
    internal: true
    preconditions:
      - sh: test -n "$GRIM_INDEXER_DIR"
        msg: GRIM_INDEXER_DIR must name a checkout of grimoire-rs/indexer at the release tag in test/data/index_e2e/INDEXER_REF
    cmds:
      # --prefix keeps ocx on this repo's toolchain: the indexer ships its own ocx.toml.
      - ocx exec -- npm --prefix "$GRIM_INDEXER_DIR" ci --ignore-scripts
      - ocx exec -- npm --prefix "$GRIM_INDEXER_DIR" run build

  index-e2e:
    desc: Build the fixture index with the pinned indexer and sync it with grim 0.14.3 and the built grim
    summary: |
      Runs test/tests/test_index_e2e.py (marker index_e2e). Needs GRIM_INDEXER_DIR,
      a checkout of grimoire-rs/indexer at the release tag in
      test/data/index_e2e/INDEXER_REF; it is installed and built here on every
      run, so a moved pin never meets a stale dist/. grim 0.14.3 comes from the
      ocx group g0. Set GRIM_REQUIRE_INDEX_E2E=1 to make a missing input a
      failure, not a skip.
    vars:
      G0_COMMAND:
        sh: ocx exec -g g0 -- sh -c 'command -v grim'
    cmds:
      - task: build
        vars:
          SKIP_BUILD: "{{.SKIP_BUILD}}"
      - task: .index-e2e-indexer
      - ocx exec -- uv run pytest -m index_e2e tests/test_index_e2e.py {{.CLI_ARGS | default "-v"}}
    env:
      GRIM_COMMAND: "{{.GRIM_BINARY}}"
      GRIM_G0_COMMAND: "{{.G0_COMMAND}}"

  index-matrix:
    desc: Run every grim generation against every index kind
    summary: |
      Runs test/tests/test_index_matrix.py. grim 0.14.3 comes from the ocx group
      g0. The 0.15.0 leg resolves from a group g1 once one is pinned in ocx.toml
      and skips with "0.15.0 not published" until then; with g1 declared, a
      resolution failure fails the task instead of skipping the leg. The built
      grim always runs.
    vars:
      G0_COMMAND:
        sh: ocx exec -g g0 -- sh -c 'command -v grim'
      G1_COMMAND:
        sh: if grep -q '^\[group\.g1[].]' '{{.ROOT_DIR}}/ocx.toml'; then ocx exec -g g1 -- sh -c 'command -v grim'; fi
    cmds:
      - task: build
        vars:
          SKIP_BUILD: "{{.SKIP_BUILD}}"
      - ocx exec -- uv run pytest tests/test_index_matrix.py {{.CLI_ARGS | default "-v -rs"}}
    env:
      GRIM_COMMAND: "{{.GRIM_BINARY}}"
      GRIM_G0_COMMAND: "{{.G0_COMMAND}}"
      GRIM_G1_COMMAND: "{{.G1_COMMAND}}"

  old-grim:
    desc: Run the grim 0.15.1 interop modules against GRIM_OLD_BIN; any skip fails the run
    summary: |
      Runs the modules that hand locks, state and caches between grim 0.15.1
      (GRIM_OLD_BIN, the v0.15.1 release binary) and the current grim
      (GRIM_COMMAND, else the built test/bin/grim). A dev build that prints
      0.15.1 fails the run (src/old_grim.py). Writes results/old-grim/junit.xml,
      then fails on any case that did not pass, a skip included, and on a module
      that ran no case.
    vars:
      MODULES: >-
        tests/test_old_grim_dependencies.py
        tests/test_old_grim_lock_pins.py
        tests/test_old_grim_marketplace_pins.py
        tests/test_old_grim_remove_unread.py
        tests/test_old_grim_settings.py
        tests/test_old_grim_unwalked_requires.py
        tests/test_marketplace_stale_remedy.py
        tests/test_catalog_kindless_upgrade.py::test_grim_0_15_1_lists_the_rows_this_grim_cached
      REPORT: results/old-grim/junit.xml
    preconditions:
      - sh: test -n "$GRIM_OLD_BIN"
        msg: GRIM_OLD_BIN must name the grim binary from the v0.15.1 release (grimoire-<target>.tar.gz)
    cmds:
      - task: build
        vars:
          SKIP_BUILD: "{{.SKIP_BUILD}}"
      # A report left by an earlier run must not stand in for one that died.
      - rm -f '{{.REPORT}}'
      - ocx exec -- uv run pytest -n auto -rs --junit-xml='{{.REPORT}}' {{.MODULES}} {{.CLI_ARGS}}
      - python3 tools/require_all_passed.py --junit '{{.REPORT}}' {{.MODULES}}
    env:
      GRIM_COMMAND: "{{.GRIM_BINARY}}"

  bench:
    desc: Assert the 20,000-entry sync budgets (time, memory, bytes written)
    summary: |
      Runs test/tests/test_index_bench.py (marker bench) against a synthetic
      index and prints each measurement. Excluded from the ordinary run.
    cmds:
      - task: build
        vars:
          SKIP_BUILD: "{{.SKIP_BUILD}}"
      - ocx exec -- uv run pytest -m bench tests/test_index_bench.py {{.CLI_ARGS | default "-v -s"}}
    env:
      GRIM_COMMAND: "{{.GRIM_BINARY}}"

  quick:
    desc: Run acceptance tests in parallel without rebuilding the binary
    cmds:
      - task: default
        vars:
          SKIP_BUILD: "true"
          CLI_ARGS: '-n auto {{.CLI_ARGS | default "-v"}}'

  parallel:
    desc: Run acceptance tests in parallel
    sources:
      - tests/**/*.py
      - src/**/*.py
      - conftest.py
      - tests/conftest.py
      - pyproject.toml
      - '{{.ROOT_DIR}}/target/release/grim'
    cmds:
      - task: default
        vars:
          CLI_ARGS: '-n auto {{.CLI_ARGS | default "-v"}}'

  shard:
    desc: Run one shard of the acceptance suite in parallel (SHARD_COUNT, SHARD_INDEX, SHARD_LABEL)
    summary: |
      Runs the modules tools/accept_shard.py selects for shard SHARD_INDEX of
      SHARD_COUNT, under the same markers as `task test`, and writes
      results/junit-<SHARD_LABEL>-<SHARD_INDEX>-of-<SHARD_COUNT>.xml. CI passes
      the runner OS as the label, so two legs of one run cannot collide. A shard
      is a subset: `task test:floor` judges the whole set.
    requires:
      vars: [SHARD_COUNT, SHARD_INDEX, SHARD_LABEL]
    vars:
      # A var, not a pipe: a refused selection must stop the task, or pytest runs
      # all of `testpaths` and reports the wrong shard green.
      MODULES:
        sh: uv run python tools/accept_shard.py --shard-count '{{.SHARD_COUNT}}' --shard-index '{{.SHARD_INDEX}}'
      REPORT: results/junit-{{.SHARD_LABEL}}-{{.SHARD_INDEX}}-of-{{.SHARD_COUNT}}.xml
    cmds:
      - task: build
        vars:
          SKIP_BUILD: "{{.SKIP_BUILD}}"
      # A report left by an earlier run must not stand in for a shard that died.
      - rm -f '{{.REPORT}}'
      - ocx exec -- uv run pytest -n auto -m "not index_e2e and not bench" --junit-xml='{{.REPORT}}' {{catLines .MODULES}} {{.CLI_ARGS | default "-v"}}
    env:
      GRIM_COMMAND: "{{.GRIM_BINARY}}"

  floor:
    desc: Merge the shard reports into results/junit.xml and judge the whole suite (SHARD_COUNT, SHARD_LABEL)
    summary: |
      Runs tools/accept_floor.py over the SHARD_COUNT reports `task test:shard`
      wrote under SHARD_LABEL. Refuses a failed case, a missing shard, a duplicate
      case, a count under SUITE_FLOOR, skips or xfails over SKIP_CEILING or
      XFAIL_CEILING, and a parked test. Standard library and git only.
    requires:
      vars: [SHARD_COUNT, SHARD_LABEL]
    cmds:
      - python3 tools/accept_floor.py --label '{{.SHARD_LABEL}}' --shard-count '{{.SHARD_COUNT}}'

  demo:
    desc: Record every cast declared under test/recordings/casts/ (task test:demo)
    summary: |
      Runs test/recordings/test_record_casts.py, parametrized over
      test/recordings/casts/*.yaml, against a real grim binary. Each cast
      declares its own output path and asserts its own output, so a cast is
      only written when its commands succeeded. The casts are committed
      assets -- review the diff (`git diff docs/public/`) after re-running
      and commit deliberately. Outside `testpaths`, so `task test` never
      collects it.

      Arguments after `--` reach pytest unchanged (CLI_ARGS), so
      `task test:demo -- -k registries` records the one cast whose file name
      matches. With none, every cast is recorded.
    cmds:
      - task: build
        vars:
          SKIP_BUILD: "{{.SKIP_BUILD}}"
      - ocx exec -- uv run pytest recordings/ -v {{.CLI_ARGS}}
    env:
      GRIM_COMMAND: "{{.GRIM_BINARY}}"
