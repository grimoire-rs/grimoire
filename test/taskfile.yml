# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  BIN_DIR: "{{.ROOT_DIR}}/test/bin"
  GRIM_BINARY: "{{.BIN_DIR}}/grim{{exeExt}}"
  SKIP_BUILD: '{{.SKIP_BUILD | default .CI | default "false"}}'

tasks:
  build:
    internal: true
    cmds:
      - cargo build --release --locked
      - mkdir -p {{.BIN_DIR}}
      - cp {{.ROOT_DIR}}/target/release/grim{{exeExt}} {{.GRIM_BINARY}}
    status:
      - '{{eq .SKIP_BUILD "true"}}'

  default:
    desc: Run acceptance tests (builds the grim binary automatically)
    cmds:
      - task: build
        vars:
          SKIP_BUILD: "{{.SKIP_BUILD}}"
      - uv run pytest {{.CLI_ARGS | default "-v"}}
    env:
      GRIM_COMMAND: "{{.GRIM_BINARY}}"

  quick:
    desc: Run acceptance tests in parallel without rebuilding the binary
    cmds:
      - task: default
        vars:
          SKIP_BUILD: "true"
          CLI_ARGS: '-n auto {{.CLI_ARGS | default "-v"}}'

  parallel:
    desc: Run acceptance tests in parallel
    sources:
      - tests/**/*.py
      - src/**/*.py
      - conftest.py
      - tests/conftest.py
      - pyproject.toml
      - '{{.ROOT_DIR}}/target/release/grim'
    cmds:
      - task: default
        vars:
          CLI_ARGS: '-n auto {{.CLI_ARGS | default "-v"}}'

  demo:
    desc: Record the landing-page demo cast (init/add/status against a live registry)
    summary: |
      Runs test/recordings/test_record_demo.py against a real grim binary and
      a real OCI registry (reusing the acceptance suite's own fixtures), and
      writes docs/src/demo.cast. Outside `testpaths`, so `task test` never
      collects it -- explicit invocation only. Follow with `task demo:gif` to
      render docs/src/demo.gif, the asset the landing page actually embeds.
    cmds:
      - task: build
        vars:
          SKIP_BUILD: "{{.SKIP_BUILD}}"
      - uv run pytest recordings/ -v
    env:
      GRIM_COMMAND: "{{.GRIM_BINARY}}"

  demo:gif:
    desc: Convert docs/src/demo.cast to docs/src/demo.gif (requires agg)
    preconditions:
      - sh: command -v agg
        msg: "agg not found -- install from https://github.com/asciinema/agg (cargo install --locked agg)"
      - sh: test -f {{.ROOT_DIR}}/docs/src/demo.cast
        msg: "docs/src/demo.cast missing -- run `task demo` first"
    cmds:
      # "Adwaita Mono" is a common Linux system font (fontconfig-resolved, no
      # --font-dir needed); font-size 13 keeps the rendered GIF's width sane
      # against the recording's 180-column PTY (see cast_recorder.py). No
      # --theme flag: agg auto-picks up the cast's own embedded theme.
      - agg --font-family "Adwaita Mono" --font-size 13 {{.ROOT_DIR}}/docs/src/demo.cast {{.ROOT_DIR}}/docs/src/demo.gif
