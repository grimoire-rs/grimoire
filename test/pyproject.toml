[project]
name = "grimoire-tests"
version = "0.0.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "index_e2e: builds an index with the pinned indexer; needs GRIM_INDEXER_DIR and GRIM_G0_COMMAND (deep verify, task test:index-e2e)",
    "bench: timed 20,000-entry sync budgets; run by deep verify only",
]

# Temp-dir retention: pytest keeps the last 3 runs and every test's tmp_path by
# default, so disk use tracks total tests rather than concurrent failures.
# "failed" reclaims a passing test's dir at teardown; count=1 drops the
# cross-run multiplier. Keep a passing dir while debugging with
# `-o tmp_path_retention_policy=all`.
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "pexpect>=4.9",
    "rich>=14.0",
    "opentelemetry-proto>=1.45.1",
]
