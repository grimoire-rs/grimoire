#:schema https://ocx.sh/schemas/project/v1.json
# OCX project toolchain — managed by `ocx add` / `ocx remove`

[tools]
zot = "ocx.sh/project-zot/zot:2"
node = "ocx.sh/nodejs/node:24"
cargo-deny = "ocx.sh/embarkstudios/cargo-deny:0.20"
hawkeye = "ocx.sh/hawkeye/hawkeye:7"
lychee = "ocx.sh/lychee/lychee:0.24"
ruff = "ocx.sh/astral-sh/ruff:0.17"
shellcheck = "ocx.sh/shellcheck/shellcheck:0.11"
shfmt = "ocx.sh/shfmt/shfmt:3"
uv = "ocx.sh/astral-sh/uv:0.13"

# g0 pins grim 0.14.3 for the index end-to-end test.
[group.g0.tools]
grim = "ocx.sh/grimoire/cli:0.14.3"
