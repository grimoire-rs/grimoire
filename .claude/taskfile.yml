# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  REPORTS_DIR: '{{if .REPORTS_ROOT}}{{.REPORTS_ROOT}}/claude{{else}}{{.TASKFILE_DIR}}/reports{{end}}'

x-shared:
  claude-sources: &claude-sources
    - '**/*'
    - '../CLAUDE.md'
    - '../AGENTS.md'
    - '../taskfile.yml'
    - '../taskfiles/**/*.yml'
    - '../.github/workflows/**'
    - '../.agents/plans/*.md'
    - exclude: '**/__pycache__/**'
    - exclude: '**/.venv/**'
    - exclude: '**/.state/**'
    - exclude: '**/.locks/**'

tasks:
  verify:
    desc: Validate the .claude/ subsystem (structural tests + link check)
    cmds:
      - task: tests
      - task: lint:links

  statusline:install:
    desc: Install the enhanced cross-platform Claude Code statusline to ~/.claude/
    platforms: [linux, darwin]
    cmds:
      - bash scripts/statusline-install.sh

  tests:
    desc: Validate AI configuration structural integrity (.claude/tests/test_ai_config.py)
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - mkdir -p {{.REPORTS_DIR}}
      - >
        uv run --directory tests pytest test_ai_config.py -v
        --junitxml={{.REPORTS_DIR}}/tests.junit.xml
    sources: *claude-sources
    generates:
      - '{{.REPORTS_DIR}}/tests.junit.xml'

  fix:canonical-block:
    desc: Re-sync canonical Review-Fix Loop block from workflow-bugfix.md to workflow-refactor.md
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - python3 scripts/sync-canonical-blocks.py

  lint:links:
    desc: Check markdown cross-references in .claude/, CLAUDE.md, and AGENTS.md (offline; skipped if lychee absent)
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - mkdir -p {{.REPORTS_DIR}}
      - |
        if ! command -v lychee >/dev/null 2>&1; then
          echo "lychee not installed — skipping link check (install: https://github.com/lycheeverse/lychee)"
          exit 0
        fi
        # Two exclusions carry a reason beyond "it is noisy":
        #   rules/docs-quality/checks/fixtures — inputs to a link checker, so
        #     unresolvable links are the point of the fixture, not rot.
        #   rules/rust-cargo/crates-of-record.md — vendored prose citing a path
        #     that exists only in its upstream repo. Fix it upstream; a local
        #     edit is lost on sync. Scoped to the one file so the rest of that
        #     rule's links stay checked.
        lychee --offline --no-progress --include-verbatim \
          --exclude-path templates/artifacts \
          --exclude-path tests/.venv \
          --exclude-path worktrees \
          --exclude-path rules/docs-quality/checks/fixtures \
          --exclude-path rules/rust-cargo/crates-of-record.md \
          --format json --output {{.REPORTS_DIR}}/lint-links.json \
          ../CLAUDE.md ../AGENTS.md .
    sources: *claude-sources
    generates:
      - '{{.REPORTS_DIR}}/lint-links.json'
