# Documentation discovery artifact — produced by the docs-plan procedure.
# One row per shortlisted reader task. Regenerate on feature merges; diff on
# release tags (DOC-DISC-12). Nothing in this file is documentation prose.
#
# Evidence rule: every claim below comes from the repository, its issue tracker,
# the CHANGELOG, or a run that was actually performed (friction logs beside this
# file). Nothing was sourced from an existing docs page title.

product_shape: cli
generator: mdbook                  # docs/book.toml, mdBook 0.5.3, GitHub Pages
generator_candidate: astro-starlight
generator_candidate_note: >-
  Owner raised on 2026-09-06: move the docs site to Astro so it matches the
  index site (index.grimoire.rs is rendered by the Astro-based indexer).
  Decision pending. The plan below is generator-neutral: on Starlight the nav
  moves from docs/src/SUMMARY.md to the astro.config.* sidebar, groups map 1:1,
  and .mdx pages need the {/* doc_type: ... */} opener instead of an HTML comment.
signal: friction-log-severity
signal_note: >-
  issue-pr-frequency was considered first and rejected as the ranking signal:
  the tracker holds maintainer-filed defect reports on a single-maintainer,
  pre-1.0 project, not reader demand. There is no invocation telemetry
  (issue #83 is open) and no search log. Ten friction logs were run by
  sandboxed personas with no repository access (2026-09-06); rank 1-10 is
  measured severity, rank 11-27 is provisional (no log run) and ordered by
  adjacency to measured pain.
generated: 2026-09-06
grim_version: 0.14.1
surface_sources:
  - cli-subcommand          # grim --help, 24 subcommands
  - readme-heading          # README.md: Install, Quick Start, Run Your Own Index, Development, Community, License
  - issue-title             # gh issue list --state all (110 issues)
  - pr-title                # gh pr list --state all (112 PRs)
  - changelog               # CHANGELOG.md ### Added / ### Changed, 0.1.0 .. 0.14.1
  - maintainer-request      # owner's brief, 2026-09-06 (scope, shared dirs, TUI, filters, clients, re-render, own index)
  - community-pain-points   # web research 2026-09-06, .agents/research/research_docs_pain_points.md (router weighting only, not the rank signal)

# DOC-DISC-08: every top-level subcommand appears here, mapped to a task or an
