# Drift found by the personas (docs contradict the binary or each other).
drift:
  - page: docs/src/commands.md
    where: "grim search"
    what: "one paragraph says the plain table names the serving registry in a source column, a later paragraph says source is JSON-only and the table keeps five columns; the binary prints no such column"
    log: T06
  - page: docs/src/quickstart.md
    where: "step 2 / step 3"
    what: "promises materialisation 'into the clients it detects'; in a fresh project with no client marker the artifact lands in the agents pool, which Claude Code does not read, with no warning printed"
    log: [T02, T03, T08]
  - page: docs/src/commands.md
    where: "grim install"
    what: "the stale-lock refusal (exit 65, declaration_hash mismatch) is not documented under the command that raises it"
    log: T09
  - page: docs/src/json-interface.md
    where: "status report"
    what: "state value 'stale' is listed and defined nowhere; the outputs array drops a dropped client's still-on-disk output silently"
    log: [T08, T07]
  - page: docs/src/configuration.md
    where: "Qualified references"
    what: "alias/repo syntax is shown only for oci-type aliases; against an index-type alias it fails with a parse error and the page does not say whether that is intended"
    log: T06

# Product observations that are not documentation gaps. For the owner to triage.
product_observations:
  - "A fresh project with no client marker silently falls back to the agents client; three personas expected the skill in the Claude Code directory. The quick start's own command reproduces it. Candidate for a printed hint or a quick-start-time prompt (issue-worthy)."
  - "grim install prints one result row when it writes two outputs (native dir plus shared pool); grim status shows one undifferentiated row (T04, T07)."
  - "grim status --check always exits 0, so it cannot serve as a CI gate; the gate is grim install's stale-lock refusal (T09)."

