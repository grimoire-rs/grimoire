name: Docs

# Build the Starlight (Astro) documentation site and publish it to GitHub Pages.
#
# The JSON Schemas served at /schemas/ are generated from grim's parse
# structs at build time (never committed), so this workflow must rebuild
# whenever those structs — or anything they pull in — change. That is why
# `src/**` and the Cargo manifests are in the path filter alongside `docs/`.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      # C-010's catalog link lint needs a trigger — twenty catalog/** files
      # plus README.md carry https://grimoire.rs/*.html links that the URL
      # check validates.
      - 'catalog/**'
      - 'README.md'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'taskfiles/docs.taskfile.yml'
      - 'taskfiles/schema.taskfile.yml'
      - 'taskfiles/rust.taskfile.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; let an in-flight deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    # Narrower than the workflow-level set on purpose. This job runs `npm ci`
    # and `astro build` over ~485 third-party packages plus esbuild's
    # postinstall, and nothing in it consumes an OIDC token — `deploy` does.
    # Without this block a compromised transitive dependency could mint an
    # OIDC token for this repository against any cloud trust policy the org
    # has. `deploy` declares no permissions of its own, so it still inherits
    # the full workflow-level set and the deploy path is unchanged.
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `external/docker_credential` is the [patch.crates-io] source; the
          # grim build (needed to generate the schemas) fails without it.
          submodules: recursive
          # `.gitattributes` tracks `*.png` in LFS, and `docs/public/og-card.png`
          # is the social preview every share link renders. Without this the
          # checkout leaves a pointer file, Astro copies `docs/public/` into
          # `docs/dist/` verbatim — pointer text and all — and the card 404s as
          # an image everywhere it is unfurled.
          lfs: true
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          matcher: true
      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Setup Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      # Builds grim, regenerates docs/public/schemas/*.json from the parser,
      # then builds the site — so the published schemas always match grim.
      - name: Build the site
        run: task docs:build
      # Link, URL, declaration and npm audit checks run here so a failure
      # fails the build job and the deploy job never runs.
      - name: Check the docs
        run: task docs:check
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # GitHub Pages intermittently returns a terminal "Deployment failed, try
      # again later." on the status poll — a platform flake, not a build error.
      # deploy-pages does not retry a failed status, so retry the action once.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
