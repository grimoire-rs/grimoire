name: Docs

# Build the mdBook documentation site and publish it to GitHub Pages.
#
# The JSON Schemas served at /schemas/ are generated from grim's parse
# structs at build time (never committed), so this workflow must rebuild
# whenever those structs — or anything they pull in — change. That is why
# `src/**` and the Cargo manifests are in the path filter alongside `docs/`.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'taskfiles/docs.taskfile.yml'
      - 'taskfiles/schema.taskfile.yml'
      - 'taskfiles/rust.taskfile.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; let an in-flight deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `external/docker_credential` is the [patch.crates-io] source; the
          # grim build (needed to generate the schemas) fails without it.
          submodules: recursive
          # `.gitattributes` tracks `*.png` in LFS, and `docs/src/og-card.png`
          # is the social preview every share link renders. Without this the
          # checkout leaves a pointer file, mdBook copies the pointer text
          # through, and the card 404s as an image everywhere it is unfurled.
          lfs: true
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          matcher: true
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      # Pinned to 0.5.3: docs/theme/index.hbs vendors that release's stock
      # index.hbs byte for byte. Bumping the pin needs a re-copy via
      # `mdbook init --theme` and a re-diff, or it silently drifts from upstream.
      - name: Install mdBook
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: mdbook@0.5.3
      # Builds grim, regenerates docs/src/schemas/*.json from the parser,
      # then builds the book — so the published schemas always match grim.
      - name: Build the book
        run: task docs:build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # GitHub Pages intermittently returns a terminal "Deployment failed, try
      # again later." on the status poll — a platform flake, not a build error.
      # deploy-pages does not retry a failed status, so retry the action once.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
