name: Verify Deep

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build & Unit Test (${{ matrix.job.name }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: ubuntu-latest, name: Linux, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, name: macOS, target: aarch64-apple-darwin }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # `external/docker_credential` is the [patch.crates-io] source.
          submodules: recursive
      - name: Build
        uses: ./.github/actions/build-rust
        with:
          target: ${{ matrix.job.target }}
      - name: Install nextest
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
      - name: Test
        run: cargo nextest run --target=${{ matrix.job.target }} --profile ci --locked
      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deep-unit-${{ matrix.job.name }}
          path: target/nextest/ci/junit.xml

  cross-compile:
    name: Cross-compile (${{ matrix.job.name }})
    runs-on: ubuntu-latest
    container:
      image: messense/cargo-xwin
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: Windows x64, target: x86_64-pc-windows-msvc }
          - { name: Windows ARM64, target: aarch64-pc-windows-msvc }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # `external/docker_credential` is the [patch.crates-io] source.
          submodules: recursive
      - name: Install Rust target
        run: rustup target add ${{ matrix.job.target }}
      - name: Build
        run: cargo xwin build --release --target=${{ matrix.job.target }} --locked
      - name: Prepare Binary
        run: cp target/${{ matrix.job.target }}/release/grim.exe grim-${{ matrix.job.target }}.exe
      - name: Upload grim Binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grim-${{ matrix.job.target }}
          path: grim-${{ matrix.job.target }}.exe
          compression-level: 0
          retention-days: 7

  # Two jobs with deliberately different names, because they are not the same
  # gate. Linux runs the whole suite against a real `registry:2`. Windows
  # cannot: the runner hosts no Linux container engine, so the registry-backed
  # ~68% of the suite has nothing to talk to.
  #
  # That job used to report green anyway, at "254 passed, 528 skipped" — a
  # green gate over a suite that mostly did not run, which is exactly what
  # `test/conftest.py`'s registry refusal was later written to stop. The
  # refusal was right; the job's *name* was the lie. So `GRIM_ALLOW_NO_REGISTRY`
  # is set here **only** for Windows, and the job is called what it is.
  #
  # The ~254 tests that do run are worth keeping: they are the ones covering
  # Windows path handling, junctions and PATHEXT, which no Linux job can
  # exercise. Do not rename this back to "Acceptance" without giving Windows a
  # reachable registry first (`GRIM_TEST_REGISTRY_HOST`).
  acceptance-tests:
    name: ${{ matrix.job.gate }} (${{ matrix.job.name }})
    needs: [build, cross-compile]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: ubuntu-latest, name: Linux, target: x86_64-unknown-linux-gnu, ext: "", gate: Acceptance, no_registry: "" }
          - { os: macos-latest, name: macOS, target: aarch64-apple-darwin, ext: "", gate: Acceptance, no_registry: "" }
          - { os: windows-latest, name: Windows, target: x86_64-pc-windows-msvc, ext: ".exe", gate: Platform Check, no_registry: "1" }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: grim-${{ matrix.job.target }}
          path: test/bin
      - name: Prepare Binary
        shell: bash
        run: |
          mv "test/bin/grim-${{ matrix.job.target }}${{ matrix.job.ext }}" "test/bin/grim${{ matrix.job.ext }}"
          chmod +x test/bin/grim${{ matrix.job.ext }}
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: Setup OCX
        # Activates the root ocx.toml, putting the suite's zot registry on PATH.
        uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: "0.6.3"
          groups: default
      - name: Run Acceptance Tests
        shell: bash
        run: task test -- --junit-xml=results/junit.xml
        env:
          SKIP_BUILD: "true"
          # Empty on Linux, so the registry refusal stays fully armed there.
          GRIM_ALLOW_NO_REGISTRY: ${{ matrix.job.no_registry }}
      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deep-tests-${{ matrix.job.name }}
          path: test/results/junit.xml

  # Principle 9 evidence (C-150, C-151). The pre-hooks golden fixture pins
  # `localhost:5000` into its locks, so it needs a registry on exactly that
  # host; `task test` puts zot on a random port and the module skips there.
  # Here it runs alone, required: a skip fails, and the JUnit report must show
  # both golden tests passed. Then `p9:diff` builds origin/main's grim and
  # byte-compares it against this branch's over the hook-free scenarios.
  principle-9:
    name: Principle 9 (golden + p9 diff)
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      registry:
        image: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373 # registry:2
        ports:
          - 5000:5000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # p9:diff builds origin/main from `git archive`, submodules included.
          fetch-depth: 0
          submodules: recursive
          # This job runs branch-built code; nothing here needs the token.
          persist-credentials: false
      - name: Download Binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: grim-x86_64-unknown-linux-gnu
          path: test/bin
      - name: Prepare Binary
        run: |
          mv test/bin/grim-x86_64-unknown-linux-gnu test/bin/grim
          chmod +x test/bin/grim
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: Setup OCX
        # p9_diff runs its scenarios against the root ocx.toml's zot.
        uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: "0.6.3"
          groups: default
      - name: Golden fixture (required)
        working-directory: test
        run: uv run pytest tests/test_golden_pre_hooks.py -n 0 -v --junit-xml=results/junit.xml
        env:
          GRIM_TEST_REGISTRY_HOST: localhost:5000
          GRIM_REQUIRE_GOLDEN: "1"
      - name: Assert both golden tests passed
        working-directory: test
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("results/junit.xml").iter("testcase"))
          bad = {"failure", "error", "skipped"}
          outcomes = [next((c.tag for c in case if c.tag in bad), "passed") for case in cases]
          passed, skipped = outcomes.count("passed"), outcomes.count("skipped")
          print(f"golden: {passed} passed, {skipped} skipped, {len(outcomes)} total")
          if (passed, skipped, len(outcomes)) != (2, 0, 2):
              raise SystemExit("C-150: expected exactly 2 passed and 0 skipped golden tests")
          EOF
      - name: Upload Golden Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deep-golden
          path: test/results/junit.xml
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Principle 9 differential run
        run: |
          # With no source change against main the two binaries are the same
          # build, which p9:diff refuses as vacuous (exit 2) unless told the
          # run is the baseline. Same predicate as p9_diff.py's own check.
          if git diff --quiet origin/main -- src Cargo.toml Cargo.lock external; then
            task p9:diff -- --allow-identical
          else
            task p9:diff
          fi

  # The pinned indexer builds the fixture index flat (default config), anchored,
  # and anchored with legacy off. The default build still works for the oldest
  # grim that reads an index and for this branch's grim; the anchored builds work
  # for this branch's grim. The indexer is checked out at the commit in
  # test/data/index_e2e/INDEXER_REF; grim 0.14.3 is the ocx group g0.
  # GRIM_REQUIRE_INDEX_E2E makes a missing input a failure rather than a skip,
  # and the JUnit steps below fail on any skipped test, so green means ran and
  # passed. One skip is allowed: the 0.15.0 (g1) matrix leg, only while
  # ocx.toml declares no g1 group. Once it does, that leg must run and pass.
  index-e2e:
    name: Index end-to-end
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-index-e2e-${{ github.ref }}
      # A cancel would drop this result from the first run's aggregate.
      cancel-in-progress: false
    env:
      GRIM_REQUIRE_INDEX_E2E: "1"
      GRIM_INDEXER_DIR: ${{ github.workspace }}/.indexer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs branch-built code; nothing here needs the token.
          persist-credentials: false
      - name: Read indexer pin
        id: pin
        run: |
          ref="$(tr -d '[:space:]' < test/data/index_e2e/INDEXER_REF)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::INDEXER_REF must be a full commit SHA"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout indexer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grimoire-rs/indexer
          ref: ${{ steps.pin.outputs.ref }}
          path: .indexer
          persist-credentials: false
      - name: Download Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grim-x86_64-unknown-linux-gnu
          path: test/bin
      - name: Prepare Binary
        run: |
          mv test/bin/grim-x86_64-unknown-linux-gnu test/bin/grim
          chmod +x test/bin/grim
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: Resolve ocx groups
        id: ocx-groups
        run: |
          groups="default,g0"
          if grep -q '^\[group\.g1[].]' ocx.toml; then groups="$groups,g1"; fi
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
      - name: Setup OCX
        # The root ocx.toml supplies node (the indexer build) and zot (the suite)
        # in the default group; g0 (grim 0.14.3) is pulled here and nowhere else,
        # and g1 (0.15.0) joins once ocx.toml declares it.
        uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: "0.6.3"
          groups: ${{ steps.ocx-groups.outputs.groups }}
      - name: Index end-to-end (required)
        run: task test:index-e2e -- --junit-xml=results/junit.xml
        env:
          SKIP_BUILD: "true"
      - name: Assert no index end-to-end test was skipped
        working-directory: test
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("results/junit.xml").iter("testcase"))
          bad = {"failure", "error", "skipped"}
          outcomes = [next((c.tag for c in case if c.tag in bad), "passed") for case in cases]
          passed, skipped = outcomes.count("passed"), outcomes.count("skipped")
          print(f"index-e2e: {passed} passed, {skipped} skipped, {len(outcomes)} total")
          if passed < 7 or passed != len(outcomes):
              raise SystemExit("expected at least 7 index_e2e tests, all passed, none skipped")
          EOF
      - name: Grim and index version matrix
        if: ${{ !cancelled() }}
        run: task test:index-matrix -- -rs --junit-xml=results/matrix/junit.xml
        env:
          SKIP_BUILD: "true"
      - name: Assert only the unpublished 0.15.0 matrix leg was skipped
        if: ${{ !cancelled() }}
        working-directory: test
        run: |
          python3 - <<'EOF'
          import tomllib
          import xml.etree.ElementTree as ET
          with open("../ocx.toml", "rb") as f:
              g1_pinned = "g1" in tomllib.load(f).get("group", {})
          cases = list(ET.parse("results/matrix/junit.xml").iter("testcase"))
          bad = {"failure", "error", "skipped"}
          problems, ran = [], {"g0": 0, "g1": 0, "g2": 0}
          for case in cases:
              name = case.get("name")
              outcome = next((c for c in case if c.tag in bad), None)
              if outcome is None:
                  for leg in ran:
                      ran[leg] += f"[{leg}-" in name
              elif not (outcome.tag == "skipped" and "[g1-" in name and not g1_pinned):
                  problems.append(f"{name}: {outcome.tag} {outcome.get('message')}")
          print(f"index-matrix: {len(cases)} total, passed per leg {ran}, g1 pinned: {g1_pinned}")
          required = ("g0", "g2") + (("g1",) if g1_pinned else ())
          if problems or not all(ran[leg] for leg in required):
              raise SystemExit("matrix: every leg but an unpublished g1 must pass: " + "; ".join(problems))
          EOF
      - name: Index sync budgets
        if: ${{ !cancelled() }}
        run: task test:bench -- -s --junit-xml=results/bench/junit.xml
        env:
          SKIP_BUILD: "true"
      - name: Assert no index sync budget test was skipped
        if: ${{ !cancelled() }}
        working-directory: test
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("results/bench/junit.xml").iter("testcase"))
          bad = {"failure", "error", "skipped"}
          outcomes = [next((c.tag for c in case if c.tag in bad), "passed") for case in cases]
          passed, skipped = outcomes.count("passed"), outcomes.count("skipped")
          print(f"bench: {passed} passed, {skipped} skipped, {len(outcomes)} total")
          if passed < 6 or passed != len(outcomes):
              raise SystemExit("expected at least 6 bench tests, all passed, none skipped")
          EOF
      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deep-index-e2e
          path: |
            test/results/junit.xml
            test/results/matrix/junit.xml
            test/results/bench/junit.xml

  test-results:
    name: Publish Deep Test Results
    needs: [build, cross-compile, acceptance-tests, principle-9, index-e2e]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deep-*
          path: artifacts
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        with:
          files: "artifacts/**/junit.xml"
          check_name: "Deep Test Results"
