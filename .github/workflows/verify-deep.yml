name: Verify Deep

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build & Unit Test (${{ matrix.job.name }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: ubuntu-latest, name: Linux, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, name: macOS, target: aarch64-apple-darwin }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # `external/docker_credential` is the [patch.crates-io] source.
          submodules: recursive
      - name: Build
        uses: ./.github/actions/build-rust
        with:
          target: ${{ matrix.job.target }}
      - name: Install nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - name: Test
        run: cargo nextest run --workspace --target=${{ matrix.job.target }} --profile ci --locked
      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deep-unit-${{ matrix.job.name }}
          path: target/nextest/ci/junit.xml

  cross-compile:
    name: Cross-compile (${{ matrix.job.name }})
    runs-on: ubuntu-latest
    container:
      image: messense/cargo-xwin
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: Windows x64, target: x86_64-pc-windows-msvc }
          - { name: Windows ARM64, target: aarch64-pc-windows-msvc }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # `external/docker_credential` is the [patch.crates-io] source.
          submodules: recursive
      - name: Install Rust target
        run: rustup target add ${{ matrix.job.target }}
      - name: Build
        run: cargo xwin build --release --target=${{ matrix.job.target }} --locked
      - name: Prepare Binary
        run: cp target/${{ matrix.job.target }}/release/grim.exe grim-${{ matrix.job.target }}.exe
      - name: Upload grim Binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grim-${{ matrix.job.target }}
          path: grim-${{ matrix.job.target }}.exe
          compression-level: 0
          retention-days: 7

  # C-024: the macOS leg of the launcher size gate (the others run in
  # verify-basic), plus the signature and replace checks only a native macOS
  # runner can make: the kernel kills an exec'd signed binary whose pages change
  # under it, so a replacement must be a new inode that still verifies.
  hook-size-macos:
    name: Launcher Size and Replace (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `external/docker_credential` is the [patch.crates-io] source.
          submodules: recursive
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: Build and check size
        run: task rust:hook:size TARGET=aarch64-apple-darwin BUDGET=524288
      - name: Verify signature, exec, replace, exec
        run: |
          set -euo pipefail
          built=target/aarch64-apple-darwin/hook/grim-hook
          work="$(mktemp -d)"
          mkdir "$work/hooks"
          # An unknown root is a no-op exit 0: this proves the launcher starts, not a hook.
          echo '{"schema":1,"roots":{}}' > "$work/hooks/dispatch.json"
          root=00000000000000000000000000000000
          cp "$built" "$work/hooks/grim-hook"
          codesign -v "$work/hooks/grim-hook"
          "$work/hooks/grim-hook" claude SessionStart "$root" </dev/null
          cp "$built" "$work/hooks/.grim-hook.stage"
          mv -f "$work/hooks/.grim-hook.stage" "$work/hooks/grim-hook"
          codesign -v "$work/hooks/grim-hook"
          "$work/hooks/grim-hook" claude SessionStart "$root" </dev/null

  # The Windows hook suite needs a registry and runs only the hook files; the
  # Platform Check below runs the full suite. Reproduce locally with the
  # grim-wintest run.sh before dispatching.
  hooks-windows:
    name: Hook Acceptance (Windows)
    needs: [cross-compile]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: grim-x86_64-pc-windows-msvc
          path: test/bin
      - name: Prepare Binary
        shell: bash
        run: mv test/bin/grim-x86_64-pc-windows-msvc.exe test/bin/grim.exe
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: Setup OCX
        # Activates the root ocx.toml, putting the suite's zot registry on PATH.
        uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: "0.6.3"
          groups: default
      - name: Run Windows hook suite
        shell: bash
        run: >-
          task test --
          --junit-xml=results/junit.xml
          tests/test_hooks_windows_launch.py
          tests/test_hooks_windows_replace.py
          tests/test_hooks_fixes_windows.py
        env:
          SKIP_BUILD: "true"
      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deep-hooks-Windows
          path: test/results/junit.xml

  # Two jobs with deliberately different names, because they are not the same
  # gate. Linux and macOS run the whole suite against a real registry, sharded,
  # through acceptance.yml, and are judged by the floor and ceilings in
  # `test/SUITE_FLOOR`, `test/SKIP_CEILING` and `test/XFAIL_CEILING`.
  #
  # Windows runs the same suite unsharded in one job, "Platform Check", against
  # the zot registry its Setup OCX step puts on PATH (`test/conftest.py` starts
  # it natively). It stays outside the floor and the ceilings. The latest
  # branch run (2026-11-10) reported 2,876 passed, 562 skipped, 0 failed; the
  # skips are Windows-only platform skips, not a missing registry.
  #
  # `GRIM_ALLOW_NO_REGISTRY` is set on this job only. It is the `test/conftest.py`
  # escape hatch that turns an unreachable registry into skips instead of a
  # refusal, so on this job a lost registry would skip the registry-backed
  # tests and still report green.
  acceptance-tests:
    name: Acceptance (${{ matrix.job.name }})
    needs: [build, cross-compile]
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: ubuntu-latest, name: Linux, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, name: macOS, target: aarch64-apple-darwin }
    uses: ./.github/workflows/acceptance.yml
    with:
      binary-artifact: grim-${{ matrix.job.target }}
      binary-file: grim-${{ matrix.job.target }}
      runner-os: ${{ matrix.job.os }}
      check-name: Acceptance Test Results (${{ matrix.job.name }})
      # The `deep-` prefix is what test-results downloads.
      merged-artifact: deep-tests-${{ matrix.job.name }}

  platform-check-windows:
    name: Platform Check (Windows)
    needs: [build, cross-compile]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: grim-x86_64-pc-windows-msvc
          path: test/bin
      - name: Prepare Binary
        shell: bash
        run: mv test/bin/grim-x86_64-pc-windows-msvc.exe test/bin/grim.exe
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: Setup OCX
        # Activates the root ocx.toml, putting the suite's zot registry on PATH.
        uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: "0.6.3"
          groups: default
      - name: Run Platform Check
        shell: bash
        run: task test -- --junit-xml=results/junit.xml
        env:
          SKIP_BUILD: "true"
          GRIM_ALLOW_NO_REGISTRY: "1"
      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deep-tests-Windows
          path: test/results/junit.xml

  # Principle 9 evidence (C-150, C-151). The pre-hooks and pre-dependencies
  # golden fixtures pin `localhost:5000` into their locks, so they need a
  # registry on exactly that host; `task test` puts zot on a random port and
  # the modules skip there. Here they run alone, required: a skip fails, and
  # the JUnit report must show every golden test passed. Then `p9:diff` runs the differ's self-test
  # (its own first step, so no gate can diff with an unproven differ), builds origin/main's grim and
  # byte-compares it against this branch's over the hook-free scenarios. Last, the released 0.15.1
  # binary runs the interop modules beside this branch's grim, where a skip is a failure.
  principle-9:
    name: Principle 9 (golden + p9 diff)
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      registry:
        image: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373 # registry:2
        ports:
          - 5000:5000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # p9:diff builds origin/main from `git archive`, submodules included.
          fetch-depth: 0
          submodules: recursive
          # This job runs branch-built code; nothing here needs the token.
          persist-credentials: false
      - name: Download Binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: grim-x86_64-unknown-linux-gnu
          path: test/bin
      - name: Prepare Binary
        run: |
          mv test/bin/grim-x86_64-unknown-linux-gnu test/bin/grim
          chmod +x test/bin/grim
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: Setup OCX
        # p9_diff runs its scenarios against the root ocx.toml's zot.
        uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: "0.6.3"
          groups: default
      - name: Golden fixtures (required)
        working-directory: test
        run: uv run pytest tests/test_golden_pre_hooks.py tests/test_golden_pre_dependencies.py tests/test_golden_pre_settings.py tests/test_dependencies_contract.py -n 0 -v --junit-xml=results/junit.xml
        env:
          GRIM_TEST_REGISTRY_HOST: localhost:5000
          GRIM_REQUIRE_GOLDEN: "1"
      - name: Assert every golden test passed
        working-directory: test
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("results/junit.xml").iter("testcase"))
          bad = {"failure", "error", "skipped"}
          outcomes = [next((c.tag for c in case if c.tag in bad), "passed") for case in cases]
          passed, skipped = outcomes.count("passed"), outcomes.count("skipped")
          print(f"golden: {passed} passed, {skipped} skipped, {len(outcomes)} total")
          # 2 pre-hooks + 7 pre-dependencies + 11 pre-settings + 2 dependency contract tests.
          if (passed, skipped, len(outcomes)) != (22, 0, 22):
              raise SystemExit("expected exactly 22 passed and 0 skipped golden tests")
          EOF
      - name: Upload Golden Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deep-golden
          path: test/results/junit.xml
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Principle 9 differential run
        run: |
          # With no source change against main the two binaries are the same
          # build, which p9:diff refuses as vacuous (exit 2) unless told the
          # run is the baseline. Same predicate as p9_diff.py's own check.
          if git diff --quiet origin/main -- src Cargo.toml Cargo.lock external; then
            task p9:diff -- --allow-identical
          else
            task p9:diff
          fi
      # The pinned SHA-256 is the trust anchor: the release's own .sha256 asset
      # comes from the same place as the archive, so it only cross-checks it.
      - name: Fetch grim 0.15.1
        id: old-grim
        if: ${{ !cancelled() }}
        env:
          OLD_GRIM_URL: https://github.com/grimoire-rs/grimoire/releases/download/v0.15.1/grimoire-x86_64-unknown-linux-gnu.tar.gz
          OLD_GRIM_SHA256: eec30a069ce12239058b54a9e986340cc2a3db9662504ab5ca467f8167d802c0
          OLD_GRIM_DIR: ${{ runner.temp }}/grim-0.15.1
        run: |
          set -euo pipefail
          download="$(mktemp -d)"
          for asset in "$OLD_GRIM_URL" "$OLD_GRIM_URL.sha256"; do
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --retry 3 --retry-delay 5 --retry-all-errors \
              --output "$download/${asset##*/}" "$asset"
          done
          archive="$download/${OLD_GRIM_URL##*/}"
          echo "$OLD_GRIM_SHA256  $archive" | sha256sum --check --strict
          read -r published _ < "$archive.sha256"
          if [[ "$published" != "$OLD_GRIM_SHA256" ]]; then
            echo "::error::the release's .sha256 asset does not match the pinned SHA-256"
            exit 1
          fi
          mkdir -p "$OLD_GRIM_DIR"
          tar -xzf "$archive" -C "$OLD_GRIM_DIR" --strip-components=1 grimoire-x86_64-unknown-linux-gnu/grim
          rm -rf "$download"
          "$OLD_GRIM_DIR/grim" --version
      - name: Old grim interop (required)
        if: ${{ !cancelled() && steps.old-grim.outcome == 'success' }}
        run: task test:old-grim
        env:
          SKIP_BUILD: "true"
          GRIM_OLD_BIN: ${{ runner.temp }}/grim-0.15.1/grim
      - name: Upload Old Grim Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deep-old-grim
          path: test/results/old-grim/junit.xml

  # The pinned indexer builds the fixture index flat (default config), anchored,
  # and anchored with legacy off. The default build still works for the oldest
  # grim that reads an index and for this branch's grim; the anchored builds work
  # for this branch's grim. The indexer is checked out at the commit named by
  # the release tag in test/data/index_e2e/INDEXER_REF (IX-R42); grim 0.14.3 is
  # the ocx group g0.
  # GRIM_REQUIRE_INDEX_E2E makes a missing input a failure rather than a skip,
  # and the JUnit steps below fail on any skipped test, so green means ran and
  # passed. One skip is allowed: the 0.15.0 (g1) matrix leg, only while
  # ocx.toml declares no g1 group. Once it does, that leg must run and pass.
  index-e2e:
    name: Index end-to-end
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-index-e2e-${{ github.ref }}
      # A cancel would drop this result from the first run's aggregate.
      cancel-in-progress: false
    env:
      GRIM_REQUIRE_INDEX_E2E: "1"
      GRIM_INDEXER_DIR: ${{ github.workspace }}/.indexer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs branch-built code; nothing here needs the token.
          persist-credentials: false
      - name: Read indexer pin
        id: pin
        run: |
          ref="$(tr -d '[:space:]' < test/data/index_e2e/INDEXER_REF)"
          [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::INDEXER_REF must be a release tag of the form v<major>.<minor>.<patch>"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout indexer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grimoire-rs/indexer
          # refs/tags/ keeps a same-named branch from standing in for the tag;
          # checkout fetches the tag and checks out the commit it peels to.
          ref: refs/tags/${{ steps.pin.outputs.ref }}
          path: .indexer
          persist-credentials: false
      - name: Log indexer commit
        run: git -C .indexer rev-parse HEAD
      - name: Download Binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: grim-x86_64-unknown-linux-gnu
          path: test/bin
      - name: Prepare Binary
        run: |
          mv test/bin/grim-x86_64-unknown-linux-gnu test/bin/grim
          chmod +x test/bin/grim
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: Resolve ocx groups
        id: ocx-groups
        run: |
          groups="default,g0"
          if grep -q '^\[group\.g1[].]' ocx.toml; then groups="$groups,g1"; fi
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
      - name: Setup OCX
        # The root ocx.toml supplies node (the indexer build) and zot (the suite)
        # in the default group; g0 (grim 0.14.3) is pulled here and nowhere else,
        # and g1 (0.15.0) joins once ocx.toml declares it.
        uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: "0.6.3"
          groups: ${{ steps.ocx-groups.outputs.groups }}
      - name: Index end-to-end (required)
        run: task test:index-e2e -- --junit-xml=results/junit.xml
        env:
          SKIP_BUILD: "true"
      - name: Assert no index end-to-end test was skipped
        working-directory: test
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("results/junit.xml").iter("testcase"))
          bad = {"failure", "error", "skipped"}
          outcomes = [next((c.tag for c in case if c.tag in bad), "passed") for case in cases]
          passed, skipped = outcomes.count("passed"), outcomes.count("skipped")
          print(f"index-e2e: {passed} passed, {skipped} skipped, {len(outcomes)} total")
          if passed < 7 or passed != len(outcomes):
              raise SystemExit("expected at least 7 index_e2e tests, all passed, none skipped")
          EOF
      - name: Grim and index version matrix
        if: ${{ !cancelled() }}
        run: task test:index-matrix -- -rs --junit-xml=results/matrix/junit.xml
        env:
          SKIP_BUILD: "true"
      - name: Assert only the unpublished 0.15.0 matrix leg was skipped
        if: ${{ !cancelled() }}
        working-directory: test
        run: |
          python3 - <<'EOF'
          import tomllib
          import xml.etree.ElementTree as ET
          with open("../ocx.toml", "rb") as f:
              g1_pinned = "g1" in tomllib.load(f).get("group", {})
          cases = list(ET.parse("results/matrix/junit.xml").iter("testcase"))
          bad = {"failure", "error", "skipped"}
          problems, ran = [], {"g0": 0, "g1": 0, "g2": 0}
          for case in cases:
              name = case.get("name")
              outcome = next((c for c in case if c.tag in bad), None)
              if outcome is None:
                  for leg in ran:
                      ran[leg] += f"[{leg}-" in name
              elif not (outcome.tag == "skipped" and "[g1-" in name and not g1_pinned):
                  problems.append(f"{name}: {outcome.tag} {outcome.get('message')}")
          print(f"index-matrix: {len(cases)} total, passed per leg {ran}, g1 pinned: {g1_pinned}")
          required = ("g0", "g2") + (("g1",) if g1_pinned else ())
          if problems or not all(ran[leg] for leg in required):
              raise SystemExit("matrix: every leg but an unpublished g1 must pass: " + "; ".join(problems))
          EOF
      - name: Index sync budgets
        if: ${{ !cancelled() }}
        run: task test:bench -- -s --junit-xml=results/bench/junit.xml
        env:
          SKIP_BUILD: "true"
      - name: Assert no index sync budget test was skipped
        if: ${{ !cancelled() }}
        working-directory: test
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("results/bench/junit.xml").iter("testcase"))
          bad = {"failure", "error", "skipped"}
          outcomes = [next((c.tag for c in case if c.tag in bad), "passed") for case in cases]
          passed, skipped = outcomes.count("passed"), outcomes.count("skipped")
          print(f"bench: {passed} passed, {skipped} skipped, {len(outcomes)} total")
          if passed < 6 or passed != len(outcomes):
              raise SystemExit("expected at least 6 bench tests, all passed, none skipped")
          EOF
      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deep-index-e2e
          path: |
            test/results/junit.xml
            test/results/matrix/junit.xml
            test/results/bench/junit.xml

  test-results:
    name: Publish Deep Test Results
    needs: [build, cross-compile, hooks-windows, acceptance-tests, platform-check-windows, principle-9, index-e2e]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
