name: Verify Deep

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build & Unit Test (${{ matrix.job.name }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: ubuntu-latest, name: Linux, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, name: macOS, target: aarch64-apple-darwin }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # `external/docker_credential` is the [patch.crates-io] source.
          submodules: recursive
      - name: Build
        uses: ./.github/actions/build-rust
        with:
          target: ${{ matrix.job.target }}
      - name: Install nextest
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          tool: cargo-nextest
      - name: Test
        run: cargo nextest run --target=${{ matrix.job.target }} --profile ci --locked
      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deep-unit-${{ matrix.job.name }}
          path: target/nextest/ci/junit.xml

  cross-compile:
    name: Cross-compile (${{ matrix.job.name }})
    runs-on: ubuntu-latest
    container:
      image: messense/cargo-xwin
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: Windows x64, target: x86_64-pc-windows-msvc }
          - { name: Windows ARM64, target: aarch64-pc-windows-msvc }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # `external/docker_credential` is the [patch.crates-io] source.
          submodules: recursive
      - name: Install Rust target
        run: rustup target add ${{ matrix.job.target }}
      - name: Build
        run: cargo xwin build --release --target=${{ matrix.job.target }} --locked
      - name: Prepare Binary
        run: cp target/${{ matrix.job.target }}/release/grim.exe grim-${{ matrix.job.target }}.exe
      - name: Upload grim Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grim-${{ matrix.job.target }}
          path: grim-${{ matrix.job.target }}.exe
          compression-level: 0
          retention-days: 7

  # Two jobs with deliberately different names, because they are not the same
  # gate. Linux runs the whole suite against a real `registry:2`. Windows
  # cannot: the runner hosts no Linux container engine, so the registry-backed
  # ~68% of the suite has nothing to talk to.
  #
  # That job used to report green anyway, at "254 passed, 528 skipped" — a
  # green gate over a suite that mostly did not run, which is exactly what
  # `test/conftest.py`'s registry refusal was later written to stop. The
  # refusal was right; the job's *name* was the lie. So `GRIM_ALLOW_NO_REGISTRY`
  # is set here **only** for Windows, and the job is called what it is.
  #
  # The ~254 tests that do run are worth keeping: they are the ones covering
  # Windows path handling, junctions and PATHEXT, which no Linux job can
  # exercise. Do not rename this back to "Acceptance" without giving Windows a
  # reachable registry first (`GRIM_TEST_REGISTRY_HOST`).
  acceptance-tests:
    name: ${{ matrix.job.gate }} (${{ matrix.job.name }})
    needs: [build, cross-compile]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: ubuntu-latest, name: Linux, target: x86_64-unknown-linux-gnu, ext: "", gate: Acceptance, no_registry: "" }
          - { os: windows-latest, name: Windows, target: x86_64-pc-windows-msvc, ext: ".exe", gate: Platform Check, no_registry: "1" }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grim-${{ matrix.job.target }}
          path: test/bin
      - name: Prepare Binary
        shell: bash
        run: |
          mv "test/bin/grim-${{ matrix.job.target }}${{ matrix.job.ext }}" "test/bin/grim${{ matrix.job.ext }}"
          chmod +x test/bin/grim${{ matrix.job.ext }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Setup Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      - name: Run Tests
        shell: bash
        run: task test -- --junit-xml=results/junit.xml
        env:
          SKIP_BUILD: "true"
          # Empty on Linux, so the registry refusal stays fully armed there.
          GRIM_ALLOW_NO_REGISTRY: ${{ matrix.job.no_registry }}
      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deep-tests-${{ matrix.job.name }}
          path: test/results/junit.xml

  test-results:
    name: Publish Deep Test Results
    needs: [build, cross-compile, acceptance-tests]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: deep-*
          path: artifacts
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          files: "artifacts/**/junit.xml"
          check_name: "Deep Test Results"
