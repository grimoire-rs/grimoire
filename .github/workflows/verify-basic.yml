name: Basic Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

# Superseded pushes to a feature branch stop burning runners; main never
# cancels, so every landed commit keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  conventional-commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check conventional commits
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          command: check
          args: "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  dco:
    name: DCO Sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: Check sign-off
        # SHAs via env, not inline interpolation — the repo-wide rule against
        # expanding `${{ }}` straight into a shell command.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: task git:dco RANGE="$BASE_SHA..$HEAD_SHA"

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `external/docker_credential` is the [patch.crates-io] source.
          # cargo-deny runs `cargo metadata` to build the dependency graph
          # before it checks anything, and that fails outright on a missing
          # patch directory — the checks never run at all.
          submodules: recursive
      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: Install cargo-deny
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny
      # Its own job, not a step in smoke: neither check needs the compiled
      # binary, both finish in well under a minute, and a dependency-licence
      # failure should not be reported as "the build broke".
      - name: Dependency licences
        id: licenses
        run: task rust:license:deps
        continue-on-error: true
      - name: RUSTSEC advisories
        id: advisories
        run: task rust:audit
        continue-on-error: true
      - name: Check supply-chain results
        if: ${{ !cancelled() }}
        run: |
          if [[ "${{ steps.licenses.outcome }}" == "failure" || "${{ steps.advisories.outcome }}" == "failure" ]]; then
            echo "::error::Supply-chain checks failed (licenses=${{ steps.licenses.outcome }}, advisories=${{ steps.advisories.outcome }})"
            exit 1
          fi

  smoke:
    name: Smoke (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `external/docker_credential` is the [patch.crates-io] source; the
          # build fails without it.
          submodules: recursive
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          matcher: true
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: Install nextest
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest
      - name: Check formatting
        id: fmt
        run: task rust:format:check
        continue-on-error: true
      - name: Clippy
        id: clippy
        run: task rust:clippy:check
        continue-on-error: true
      - name: Build
        run: task rust:build
      - name: Validate catalog
        run: task catalog:verify
      - name: Test
        run: task rust:test:unit -- --profile ci
      - name: Upload Binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grim-binary
          path: target/release/grim
          compression-level: 0
          retention-days: 1
      - name: Publish Unit Test Results
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        with:
          files: target/nextest/ci/junit.xml
          check_name: "Unit Test Results"
      - name: Check lint results
        if: ${{ !cancelled() }}
        run: |
          if [[ "${{ steps.fmt.outcome }}" == "failure" || "${{ steps.clippy.outcome }}" == "failure" ]]; then
            echo "::error::Lint checks failed (fmt=${{ steps.fmt.outcome }}, clippy=${{ steps.clippy.outcome }})"
            exit 1
          fi

  acceptance-tests:
    name: Acceptance Tests
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: grim-binary
          path: test/bin
      - name: Prepare Binary
        run: chmod +x test/bin/grim
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: Setup OCX
        # Activates the root ocx.toml, putting the suite's zot registry on PATH.
        uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: "0.6.3"
          groups: default
      - name: Run Acceptance Tests
        run: task test -- --junit-xml=results/junit.xml
        env:
          SKIP_BUILD: "true"
      - name: Publish Acceptance Test Results
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        with:
          files: test/results/junit.xml
          check_name: "Acceptance Test Results"

  # C-024: the launcher runs on every hook event, so its size is a gate. Linux
  # builds with cargo-auditable (as dist does) so `cargo audit bin` can read the
  # dependency list the SBOM does not carry for a nested build.
  hook-size:
    name: Launcher Size (${{ matrix.job.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: Linux gnu, target: x86_64-unknown-linux-gnu, budget: "524288", audit: true }
          - { name: Linux musl, target: x86_64-unknown-linux-musl, budget: "655360", audit: false }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `external/docker_credential` is the [patch.crates-io] source.
          submodules: recursive
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.job.target }}
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: Install cargo-auditable and cargo-audit
        if: ${{ matrix.job.audit }}
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-auditable,cargo-audit
      - name: Build and check size
        env:
          TARGET: ${{ matrix.job.target }}
          BUDGET: ${{ matrix.job.budget }}
          BUILD: ${{ matrix.job.audit && 'cargo auditable build' || 'cargo build' }}
        run: task rust:hook:size TARGET="$TARGET" BUDGET="$BUDGET" BUILD="$BUILD"
      - name: Audit embedded dependencies
        if: ${{ matrix.job.audit }}
        env:
          TARGET: ${{ matrix.job.target }}
        run: task rust:hook:audit TARGET="$TARGET"

  hook-size-windows:
    name: Launcher Size (Windows x64)
    runs-on: ubuntu-latest
    container:
      image: messense/cargo-xwin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `external/docker_credential` is the [patch.crates-io] source.
          submodules: recursive
      - name: Install Rust target
        run: rustup target add x86_64-pc-windows-msvc
      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: Build and check size
        run: task rust:hook:size TARGET=x86_64-pc-windows-msvc BUDGET=524288 BUILD="cargo xwin build"
