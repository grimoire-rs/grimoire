version: 2
updates:
  - package-ecosystem: github-actions
    # `/` covers .github/workflows only — composite actions need their own
    # entry, or their pins rot silently (build-rust sat on upload-artifact v4).
    directories:
      - /
      - /.github/actions/build-rust
    # release.yml is generated by `dist generate`; a dependabot bump drifts
    # it from what the pinned dist emits and `dist plan` fails the release
    # (v0.14.2, first attempt). Pins move when `cargo-dist-version` does.
    exclude-paths:
      - .github/workflows/release.yml
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-deps:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
  # The docs site's Node tree — without this entry, the repo's first npm
  # lockfile goes unpatched.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs-deps:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
