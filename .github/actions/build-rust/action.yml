name: Build Rust Binary
description: Build the grim binary for a given target (native builds only)

inputs:
  target:
    description: Rust target triple
    required: true

runs:
  using: composite
  steps:
    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      with:
        toolchain: stable
        targets: ${{ inputs.target }}
    - name: Rust Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Build
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: cargo build --release --target="$TARGET" --locked
    - name: Prepare Binary
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        ext=""
        [[ "$TARGET" == *windows* ]] && ext=".exe"
        cp "target/${TARGET}/release/grim${ext}" "grim-${TARGET}${ext}"
    - name: Upload grim Binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: grim-${{ inputs.target }}
        path: grim-${{ inputs.target }}${{ contains(inputs.target, 'windows') && '.exe' || '' }}
        compression-level: 0
        retention-days: 7
