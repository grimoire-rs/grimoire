name: Release the OCX package
description: >-
  Repackage the released archives as OCX packages, push, sign, attest and verify every
  platform, move the floating tags, announce. Called only by the `release-ocx.yml` workflow.

# Repackage the freshly built musl / darwin / windows archives as OCX packages,
# push the multi-platform package to `ghcr.io/grimoire-rs/grimoire/cli` under a
# single frozen build-timestamp, sign and attest every platform, verify them,
# push its catalog description + logo, move the floating tags, then announce
# the published tags into `ocx-sh/index` as `ocx.sh/grimoire/cli`.
#
# NOT a mirror — grimoire's own release pushed to OCX. Reference:
# ocx/.github/workflows/oci-publish.yml (repackage + push + announce) and
# ocx/.github/workflows/release.yml (`publish` job: sign, verify, then cascade).
#
# Signing identity. Every platform gets a keyless Sigstore signature and a
# signed CycloneDX SBOM attestation (built from the released tag's own source),
# all under ONE identity:
#   https://github.com/grimoire-rs/grimoire/.github/workflows/release-ocx.yml@refs/heads/main
# issued by https://token.actions.githubusercontent.com. The certificate names
# the workflow file that defines the signing JOB; a composite action's steps
# run inside that job and keep its identity, so this action may live in its own
# file while the job stays in `release-ocx.yml`. Never move the job into another
# workflow file: the certificate would name that file instead. The
# `@refs/heads/main` half holds only because cargo-dist's `release.yml` is a
# dispatched workflow and `release-ocx.yml` refuses any other ref.
#
# Order guarantee: no floating tag (`X.Y.Z`, `X.Y`, `X`, `latest`) moves before
# every platform is pushed, signed, attested and verified. All six platforms
# are pushed to the one build tag WITHOUT `--cascade`; each is then verified
# against the identity above (signature and SBOM attestation) and the count is
# checked; only then does `cascade repair` write the floating tags.
#
# One Linux runner does everything. macOS/Windows packages are built by
# cargo-dist and repacked + published here, but are NOT natively smoke-tested:
# cargo-dist cannot run a post-build step on its per-target build machines, and
# dedicated macOS/Windows test runners cost ~10x / ~2x Linux. The native
# `ocx package test` smoke therefore covers linux/amd64 (the one platform this
# runner can execute) — enough to validate the platform-independent packaging.
#
# The calling job must have checked out the repository (packaging files,
# CATALOG.md, this action) and grant `contents: read`, `packages: write`,
# `id-token: write`. A composite action cannot read `secrets`, so both tokens
# come in as inputs; constants are written to the job environment below.

inputs:
  tag:
    description: Release tag to publish, vX.Y.Z
    required: true
  github-token:
    description: GITHUB_TOKEN; authenticates the GHCR push and the release download
    required: true
  announce-token:
    description: Token for the `ocx-sh/index` announce pull request
    required: true

runs:
  using: composite
  steps:
    - name: Publish constants
      shell: bash
      run: |
        set -euo pipefail
        {
          # Make the implicit registry explicit (package test uses a registry-less id).
          echo "OCX_DEFAULT_REGISTRY=ocx.sh"
          # Logical index name — what `ocx.sh/grimoire/cli` resolves through and what
          # `package announce` names. The physical push path prepends the GHCR owner:
          # GITHUB_TOKEN only authorizes packages owned by this repository's owner.
          echo "PACKAGE=grimoire/cli"
          echo "PUSH_REPOSITORY=ghcr.io/grimoire-rs/grimoire/cli"
          # The ONE identity every signature and attestation is verified against (see the header).
          echo "SIGNING_IDENTITY=https://github.com/grimoire-rs/grimoire/.github/workflows/release-ocx.yml@refs/heads/main"
          echo "OIDC_ISSUER=https://token.actions.githubusercontent.com"
        } >> "$GITHUB_ENV"

    # Pin ocx so the package commands behave exactly as validated locally.
    # Keyless signing and `package verify --attestation` need ocx >= 0.6.0.
    - name: Install OCX
      uses: ocx-sh/setup-ocx@eaeb6788da6191868a1310cc2bba93233b586369 # v1.4.1
      with:
        version: "0.6.8"
        project: "" # binary-only; the root ocx.toml is the test toolchain, not needed here

    - name: Resolve release tag
      id: ver
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        # RELEASE_TAG arrives through `env:`, never from an expression spliced
        # into this script (blocks GitHub Actions script injection from the
        # free-form dispatch input).
        if ! [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::tag '$RELEASE_TAG' is not a clean release version (vX.Y.Z)"
          exit 1
        fi
        echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
        echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

    # The SBOM describes the released tag's source, not main's: a separate
    # directory, so the main checkout keeps supplying the packaging files.
    # `external/` holds path dependencies, hence the submodules.
    - name: Checkout the released source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: refs/tags/${{ steps.ver.outputs.tag }}
        path: tagsrc
        submodules: recursive
        persist-credentials: false

    # `cargo cyclonedx` runs with this main checkout as cwd, so main's
    # `rust-toolchain.toml` applies, not the tag's: one install, and an old
    # tag's pin may be uninstallable. The action reads that file itself.
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        cache: false # only `cargo metadata` runs; nothing worth caching

    - name: Install cargo-cyclonedx
      shell: bash
      env:
        # cargo-cyclonedx 0.5.5 (the version `cargo-cyclonedx = true` installs in the
        # cargo-dist build jobs); the checksum pins the Linux tarball, so no
        # installer script is piped into a shell.
        CARGO_CYCLONEDX_VERSION: "0.5.5"
        CARGO_CYCLONEDX_SHA256: 9136714bd6e1ac703f5c2c889af578d9783852886d6ebfe18d471555637ad2b3
      run: |
        set -euo pipefail
        archive="cargo-cyclonedx-x86_64-unknown-linux-gnu.tar.xz"
        curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$archive" \
          "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-${CARGO_CYCLONEDX_VERSION}/${archive}"
        echo "${CARGO_CYCLONEDX_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
        mkdir -p "$RUNNER_TEMP/cdx-bin"
        tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/cdx-bin" --strip-components=1 \
          cargo-cyclonedx-x86_64-unknown-linux-gnu/cargo-cyclonedx
        echo "$RUNNER_TEMP/cdx-bin" >> "$GITHUB_PATH"

    - name: Prepare announce-tags scratch file
      shell: bash
      run: |
        set -euo pipefail
        # Per-run scratch under $RUNNER_TEMP, truncated up front: GitHub reuses
        # the directory across attempts of the same run, and a leftover file
        # would resurrect tags this run did not publish.
        tags_file="$RUNNER_TEMP/announce-tags-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
        : > "$tags_file"
        echo "TAGS_FILE=$tags_file" >> "$GITHUB_ENV"

    - name: Download release archives (musl + darwin + windows)
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ steps.ver.outputs.tag }}
      run: |
        set -euo pipefail
        gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
          -p 'grimoire-*-linux-musl.tar.gz' \
          -p 'grimoire-*-apple-darwin.tar.gz' \
          -p 'grimoire-*-pc-windows-msvc.zip' \
          -D dl --clobber

    - name: Repackage, smoke-test, sign, publish and verify all platforms
      shell: bash
      env:
        # GHCR takes the workflow's own token; no registry credential to
        # provision. Hostname dots become underscores in OCX_AUTH_<host>_*.
        OCX_AUTH_ghcr_io_USER: ${{ github.actor }}
        OCX_AUTH_ghcr_io_TOKEN: ${{ inputs.github-token }}
        VERSION: ${{ steps.ver.outputs.version }}
      run: |
        set -euo pipefail

        # The musl rows stay bare: cargo-dist's musl builds are fully static,
        # so an empty `os.features` is a true claim of universality. `ocx
        # package create` reads the binary and rejects a platform key that
        # under- or over-claims what it links, so a toolchain change that made
        # these dynamic would red here rather than ship a false claim.
        declare -A PLATFORM_MAP=(
          [x86_64-unknown-linux-musl]=linux/amd64
          [aarch64-unknown-linux-musl]=linux/arm64
          [x86_64-apple-darwin]=darwin/amd64
          [aarch64-apple-darwin]=darwin/arm64
          [x86_64-pc-windows-msvc]=windows/amd64
          [aarch64-pc-windows-msvc]=windows/arm64
        )

        # Freeze ONE UTC build-timestamp so every platform shares the published
        # tag and collapses into a single multi-platform OCI image index.
        ts="$(date -u +%Y%m%d%H%M%S)"
        identifier="${PUSH_REPOSITORY}:${VERSION}_${ts}"
        echo "publishing ${identifier}"

        # Phase 1 — repackage every platform into a bin/-layout OCX bundle;
        # natively smoke-test the one platform this Linux runner can execute.
        for target in "${!PLATFORM_MAP[@]}"; do
          platform="${PLATFORM_MAP[$target]}"
          ext=""; aext="tar.gz"
          case "$target" in *windows*) ext=".exe"; aext="zip" ;; esac
          archive="dl/grimoire-${target}.${aext}"
          if [ ! -f "$archive" ]; then echo "::error::missing $archive"; exit 1; fi

          stage="$(mktemp -d)"
          # GNU tar on linux cannot read zip; use unzip for the windows archives.
          if [ "$aext" = "zip" ]; then
            unzip -q "$archive" -d "$stage"
          else
            tar -xf "$archive" -C "$stage"
          fi
          found="$(find "$stage" -name "grim${ext}" -type f | head -1)"
          if [ -z "$found" ]; then echo "::error::no grim${ext} in $archive"; exit 1; fi

          rm -rf "repackage-${target}"
          mkdir -p "repackage-${target}/bin"
          install -m 0755 "$found" "repackage-${target}/bin/grim${ext}"
          ocx package create "repackage-${target}" \
            --metadata packaging/grim/metadata.json \
            --output "pkg-${target}.tar.xz" \
            --platform "$platform"

          # Per-target CycloneDX SBOM of the released tag's source; written
          # next to the manifest (`<tagsrc>/grim-<target>.cdx.json`).
          cargo cyclonedx --format json --target "$target" \
            --manifest-path tagsrc/Cargo.toml \
            --override-filename "grim-${target}.cdx"
          if [ ! -s "tagsrc/grim-${target}.cdx.json" ]; then
            echo "::error::no SBOM generated for ${target}"
            exit 1
          fi

          if [ "$platform" = "linux/amd64" ]; then
            echo "==> native smoke test (${platform})"
            # No --metadata: `create` wrote a sidecar beside the archive and
            # `test` infers it by the same convention. Handing back the source
            # metadata instead fails — only the sidecar records the platform.
            ocx package test \
              --platform "$platform" \
              --identifier "grim:${VERSION}" \
              "pkg-${target}.tar.xz" \
              -- grim --version
          fi
        done

        # Phase 2 — push every platform to the one frozen tag, signed, with its
        # SBOM attested. NO --cascade: the floating tags move only after phase 3
        # (the "Move the floating tags" step). --tags-file records every tag
        # pushed for the announce step below.
        for target in "${!PLATFORM_MAP[@]}"; do
          platform="${PLATFORM_MAP[$target]}"
          echo "==> push ${identifier} (${platform})"
          # `image.source` is what links the GHCR package to this repository
          # and lets it inherit the repository's permissions; a registry
          # derives nothing from the path, so it has to be stated.
          ocx package push \
            --identifier "$identifier" \
            --platform "$platform" \
            --sign \
            --sbom "tagsrc/grim-${target}.cdx.json" \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tags-file "$TAGS_FILE" \
            "pkg-${target}.tar.xz"
        done

        # Phase 3 — verify every platform (signature, then SBOM attestation)
        # against the one signing identity before anything else runs. A count
        # below six fails the job here, with no floating tag moved yet.
        verified=0
        for target in "${!PLATFORM_MAP[@]}"; do
          platform="${PLATFORM_MAP[$target]}"
          echo "==> verify ${identifier} (${platform})"
          ocx package verify -p "$platform" \
            --certificate-identity "$SIGNING_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$identifier"
          ocx package verify -p "$platform" --attestation --type cyclonedx \
            --certificate-identity "$SIGNING_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$identifier"
          verified=$((verified + 1))
        done
        if [ "$verified" -ne "${#PLATFORM_MAP[@]}" ] || [ "$verified" -ne 6 ]; then
          echo "::error::verified ${verified} of 6 platforms"
          exit 1
        fi

        # Handed to the cascade step below.
        echo "BUILD_IDENTIFIER=${identifier}" >> "$GITHUB_ENV"

    - name: Push catalog description + logo
      shell: bash
      env:
        OCX_AUTH_ghcr_io_USER: ${{ github.actor }}
        OCX_AUTH_ghcr_io_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        # Pushed BEFORE the announce so the announce observes `__ocx.desc` and
        # carries the readme and logo into the index entry. CATALOG.md's
        # frontmatter supplies title/description/keywords — no flags needed.
        ocx package describe "$PUSH_REPOSITORY" \
          --readme CATALOG.md \
          --logo assets/logo.png

    # The one place a floating tag is written: every platform is pushed,
    # signed, attested and verified by now. `cascade repair` only re-points
    # tags at content the registry already serves, scoped to this build tag,
    # and appends the tags it moved to the file `announce` reads.
    - name: Move the floating tags
      shell: bash
      env:
        OCX_AUTH_ghcr_io_USER: ${{ github.actor }}
        OCX_AUTH_ghcr_io_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        ocx package cascade repair --tags-file "$TAGS_FILE" "$BUILD_IDENTIFIER"

    - name: Announce published tags into ocx-sh/index
      shell: bash
      env:
        OCX_ANNOUNCE_TOKEN: ${{ inputs.announce-token }}
        # Announce re-observes every curated tag on the physical repository
        # the index root points at, so it reads GHCR as well as writing the
        # pull request — without this it is anonymous, and a package that is
        # still private answers 403.
        OCX_AUTH_ghcr_io_USER: ${{ github.actor }}
        OCX_AUTH_ghcr_io_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        if [ -z "${OCX_ANNOUNCE_TOKEN:-}" ]; then
          echo "::error::OCX_ANNOUNCE_TOKEN is unset; the release published but the index was not told"
          exit 1
        fi
        if [ ! -s "$TAGS_FILE" ]; then
          echo "::error::no published tags recorded; refusing to announce nothing"
          exit 1
        fi
        # No --fork: the token pushes the announce branch straight to
        # ocx-sh/index and opens the pull request from there. It still lands as
        # a pull request — that is what the index's governance gate and its
        # refresh/new-package labelling run on.
        ocx package announce "$PACKAGE" \
          --tags-file "$TAGS_FILE" \
          --index-repo ocx-sh/index
